<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1280" role="img" aria-labelledby="title desc">
  <title id="title">StoryCast home page mockup</title>
  <desc id="desc">Desktop and mobile versions of the home page showing the hero, featured stories, categories, and accessibility cards.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#244b7e"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7f50"/>
      <stop offset="1" stop-color="#ffb089"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0e1e33" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="2000" height="1280" fill="#f8f9fa"/>
  <circle cx="1760" cy="170" r="170" fill="rgba(255,127,80,.15)"/>
  <circle cx="180" cy="180" r="150" fill="rgba(30,58,95,.08)"/>
  <text x="100" y="84" fill="#1E3A5F" font-family="Poppins, Arial, sans-serif" font-size="42" font-weight="800">StoryCast Home Mockup</text>
  <text x="100" y="124" fill="#5d6876" font-family="Inter, Arial, sans-serif" font-size="20">Desktop 1440px and mobile 390px layout directions</text>

