<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">StoryCast sitemap diagram</title>
  <desc id="desc">A hierarchy diagram showing the three primary pages and supporting story detail pages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#244b7e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0e1e33" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#f8f9fa"/>
  <path d="M0 760C180 720 340 724 520 748s324 50 492 8 314-86 588-42v186H0Z" fill="#edf2f7"/>
  <text x="80" y="92" fill="#1E3A5F" font-family="Poppins, Arial, sans-serif" font-size="42" font-weight="800">StoryCast Sitemap</text>
  <text x="80" y="132" fill="#5d6876" font-family="Inter, Arial, sans-serif" font-size="22">Three primary pages with supporting story detail pages</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="80" y="210" width="310" height="110" rx="24" fill="url(#bg)"/>
    <text x="110" y="256" fill="#ffffff" font-size="28" font-weight="800">Home</text>
    <text x="110" y="292" fill="rgba(255,255,255,.86)" font-size="18">Hero, featured stories, categories</text>

    <rect x="435" y="210" width="310" height="110" rx="24" fill="#ffffff" stroke="#d8e1ea"/>
    <text x="465" y="256" fill="#1E3A5F" font-size="28" font-weight="800">Story detail</text>
    <text x="465" y="292" fill="#5d6876" font-size="18">Media, transcript, related stories</text>

    <rect x="790" y="210" width="310" height="110" rx="24" fill="#ffffff" stroke="#d8e1ea"/>
    <text x="820" y="256" fill="#1E3A5F" font-size="28" font-weight="800">About / Access</text>
    <text x="820" y="292" fill="#5d6876" font-size="18">Mission, access features, contact</text>

    <line x1="390" y1="265" x2="435" y2="265" stroke="#1E3A5F" stroke-width="6" stroke-linecap="round"/>
    <line x1="745" y1="265" x2="790" y2="265" stroke="#1E3A5F" stroke-width="6" stroke-linecap="round"/>
    <polygon points="425,265 410,257 410,273" fill="#1E3A5F"/>
    <polygon points="780,265 765,257 765,273" fill="#1E3A5F"/>

    <rect x="410" y="430" width="780" height="118" rx="24" fill="#ffffff" stroke="#d8e1ea"/>
    <text x="440" y="476" fill="#1E3A5F" font-size="24" font-weight="800">Supporting story pages</text>
    <text x="440" y="510" fill="#5d6876" font-size="18">voices-of-kigali.html  |  future-of-african-innovation.html  |  artisans-journey.html</text>
    <line x1="565" y1="320" x2="565" y2="430" stroke="#1E3A5F" stroke-width="6" stroke-linecap="round"/>
    <polygon points="565,420 557,405 573,405" fill="#1E3A5F"/>
    <line x1="565" y1="430" x2="565" y2="430" stroke="#1E3A5F" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="140" y="626" width="280" height="104" rx="22" fill="#1E3A5F"/>
    <text x="168" y="668" fill="#ffffff" font-size="24" font-weight="800">Shared patterns</text>
    <text x="168" y="700" fill="rgba(255,255,255,.84)" font-size="17">Skip link, nav, footer, tokens</text>

    <rect x="450" y="626" width="280" height="104" rx="22" fill="#ff7f50"/>
    <text x="478" y="668" fill="#1E3A5F" font-size="24" font-weight="800">Accessible media</text>
    <text x="478" y="700" fill="rgba(30,58,95,.82)" font-size="17">Transcripts and captions</text>

    <rect x="760" y="626" width="280" height="104" rx="22" fill="#ffffff" stroke="#d8e1ea"/>
    <text x="788" y="668" fill="#1E3A5F" font-size="24" font-weight="800">Responsive system</text>
    <text x="788" y="700" fill="#5d6876" font-size="17">Grid, Flexbox, container queries</text>
  </g>
</svg>
