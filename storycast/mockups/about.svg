    <rect x="634" y="514" width="260" height="84" rx="22" fill="#f6f8fb" stroke="#d8e1ea"/>
    <rect x="918" y="514" width="260" height="84" rx="22" fill="#f6f8fb" stroke="#d8e1ea"/>
    <rect x="38" y="640" width="1144" height="186" rx="28" fill="#1E3A5F"/>
