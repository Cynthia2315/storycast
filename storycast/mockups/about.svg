    <rect x="648" y="92" width="534" height="330" rx="30" fill="#f6f8fb" stroke="#d8e1ea"/>
    <circle cx="918" cy="248" r="98" fill="#ff7f50"/>
    <circle cx="848" cy="230" r="56" fill="#1E3A5F"/>
    <circle cx="1000" cy="210" r="38" fill="#ffb089"/>
    <rect x="690" y="320" width="160" height="12" rx="6" fill="#d8e1ea"/>
    <rect x="690" y="344" width="240" height="12" rx="6" fill="#d8e1ea"/>
    <rect x="38" y="352" width="1144" height="244" rx="28" fill="#ffffff" stroke="#d8e1ea"/>
