  <text x="160" y="1148" fill="#1E3A5F" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Desktop view</text>
  <text x="1452" y="1148" fill="#1E3A5F" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Mobile view</text>
</svg>
